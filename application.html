    <title>JobPilot - Applications</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="application.html">Applications</a>

    <script src="script.js"></script>
